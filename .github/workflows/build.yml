# 构建与发布：把工具链打成各平台产物；打 tag 时自动建 Release 并附产物。
#
# 触发：
#   - 手动（Actions 页面 → Run workflow）：只构建，产物留在该次运行的 Artifacts 里；
#   - 推注解 tag（git tag -a v0.2.0 -m "..." && git push origin main --follow-tags）：构建 + 发 Release。
#
# 发版规范见 `docs/agents/发版.md`：CHANGELOG.md 顶部条目 / package.json 的 version /
# 注解 tag 三处对齐；Release 正文取自 CHANGELOG.md 对应段落（tools/changelog.js 提取），
# 不是自动生成的变更列表。
#
# 两种产物形态各跑一遍矩阵，都是「每平台一个原生 runner」：
#   - build：单文件可执行（Node SEA）——基底是构建机上的 node 可执行文件，只能在构建平台运行；
#   - gui：Electron 图形界面（electron-builder）——macOS 的 dmg 与签名只能在 macOS 上做。
#   两者都不做交叉构建，理由见 docs/打包与分发.md。
#
# 扩展：需要 arm64 产物时，往两个矩阵的 matrix.include 里加 `ubuntu-24.04-arm`（Linux arm64）
# 或 `windows-11-arm`（Windows arm64）即可，其余无需改动。

name: 构建与发布

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# 默认最小权限；发布 Release 的 job 再单独提权
permissions:
  contents: read

# 同一 ref 不并发，避免重复往同一个 tag 发 Release
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 打 tag 时先校验三处对齐（CHANGELOG 条目 / package.json 版本 / tag），
  # 避免版本错配、或 CHANGELOG 漏写条目的版本被发出去
  check-version:
    name: 校验版本
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 发布令牌在这里就验一次——真调 API 确认身份与写权限，别等几十分钟构建跑完
      # 才发现令牌失效或权限不够（release job 里还会再查一次非空，防的是 secret 被删）
      - name: 校验发布令牌
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::未配置 RELEASE_TOKEN secret——Release 须由作者身份创建，配置方法见 \`docs/agents/发版.md\`"
            exit 1
          fi
          login="$(gh api user --jq .login 2>/dev/null)" || {
            echo "::error::RELEASE_TOKEN 无效或已过期（调 /user 失败）"
            exit 1
          }
          if [ "$login" = "github-actions[bot]" ]; then
            echo "::error::RELEASE_TOKEN 拿到的是内置 token，建出的 Release 仍会署名 github-actions[bot]"
            exit 1
          fi
          push="$(gh api "repos/${{ github.repository }}" --jq .permissions.push 2>/dev/null)"
          if [ "$push" != "true" ]; then
            echo "::error::RELEASE_TOKEN 对 ${{ github.repository }} 没有写权限（Fine-grained 需把 Contents 设为 Read and write）"
            exit 1
          fi
          echo "发布令牌有效：$login（对 ${{ github.repository }} 有写权限）"
      # Gitee 是镜像渠道，缺令牌**不阻断** GitHub 发布——但必须明说：否则「Gitee 上怎么没有
      # 发行版」会被当成 CI 坏了去查半天。这里只查存在性；令牌失效会在发布时由 API 报错。
      - name: 校验 Gitee 令牌
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::warning::未配置 GITEE_TOKEN secret——本次不会向 Gitee 发版，Gitee 上将看不到发行版。配置方法见 \`docs/agents/发版.md\`"
          else
            echo "Gitee 令牌已配置（${#GITEE_TOKEN} 字符），发布时会同步发行版"
          fi
      - name: 校验三处对齐
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag 与 package.json 的版本 $pkg 不一致"
            exit 1
          fi
          if ! node tools/changelog.js "$tag" > /dev/null; then
            echo "::error::CHANGELOG.md 里没有 $tag 的条目"
            exit 1
          fi
          echo "三处对齐：CHANGELOG.md 条目 / package.json $pkg / tag v$tag"

  build:
    name: 构建（${{ matrix.os }}）
    needs: check-version
    runs-on: ${{ matrix.os }}
    # mac / Linux 要从源码编译一遍 node 基底（见下），整体预算放宽到 2 小时
    timeout-minutes: 120
    env:
      # 产物基底 node 固化版本：官方 node 的 ICU 数据约 28 MB，是单文件产物 >100 MB 的主因；
      # 自编译 --with-intl=small-icu 的基底能省下这部分，而本仓库的代码零 Intl 使用（grep 实证，
      # 见 docs/打包与分发.md）。固化版本保证可复现——换版本时改这里与缓存 key。
      NODE_BASE_VERSION: 22.20.0
    strategy:
      fail-fast: false        # 单个平台失败不打断其余平台，一次看清全部结果
      matrix:
        include:
          - os: windows-latest   # Windows x64
          - os: macos-latest     # macOS arm64（Apple Silicon）
          - os: macos-15-intel   # macOS Intel x64
          - os: ubuntu-latest    # Linux x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # 不开 cache: npm —— 本仓库无 dependencies，没有 package-lock.json
      - name: 单元测试
        run: npm test
      # Windows 不自编译：官方基底构建出的产物 83.6 MB 本就达标，省掉一套 VS 工具链编译的复杂度。
      # mac / Linux 官方基底分别是 107～120 MB，必须换 small-icu 基底才能进 100 MB。
      - name: 恢复自编译 node 基底缓存
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/node-small-icu
          key: node-small-icu-${{ matrix.os }}-${{ env.NODE_BASE_VERSION }}
      - name: 自编译 small-icu node 基底（mac / Linux）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          out="$RUNNER_TEMP/node-small-icu/bin"
          if [ -x "$out/node" ]; then
            echo "命中缓存：$out/node（$("$out/node" --version)，small-icu）"
            "$out/node" -p "process.config.variables.node_use_system_icu ? '有系统 ICU（编译参数失效！）' : 'small-icu 确认'" || exit 1
            exit 0
          fi
          curl -fsSL "https://nodejs.org/dist/v$NODE_BASE_VERSION/node-v$NODE_BASE_VERSION.tar.xz" -o "$RUNNER_TEMP/node-src.tar.xz"
          src="$RUNNER_TEMP/node-src"
          mkdir -p "$src"
          tar -xJf "$RUNNER_TEMP/node-src.tar.xz" -C "$src" --strip-components=1
          cd "$src"
          ./configure --with-intl=small-icu
          make -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu)"
          mkdir -p "$out"
          cp ./node "$out/node"
          "$out/node" --version
      - name: 构建单文件产物
        shell: bash
        run: |
          # 有自编译基底就用它（blob 与基底必须是同一个 node，build.js 的 --node 一次传到位）；
          # Windows 没有基底文件，走官方 node
          base="$RUNNER_TEMP/node-small-icu/bin/node"
          if [ -x "$base" ]; then
            echo "使用 small-icu 自编译基底：$base"
            npm run build -- --node "$base"
          else
            echo "无自编译基底（Windows），使用官方 node"
            npm run build
          fi
      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  # GUI 产物：Electron 打包，每平台一套（Windows 安装包 + 7z / macOS dmg / Linux AppImage + deb）。
  # 每平台构建后跑两道验证——静态自检（结构 / 语言包裁剪 / 体积）与产物启动冒烟（真的起一次窗口），
  # 都过了才上传，免得「构建成功但产物缺东西或起不来」混进 Release。
  gui:
    name: 构建 GUI（${{ matrix.os }}）
    needs: check-version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest   # Windows x64
          - os: macos-latest     # macOS arm64（Apple Silicon）
          - os: macos-15-intel   # macOS Intel x64
          - os: ubuntu-latest    # Linux x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # .npmrc 的镜像（Electron 二进制、electron-builder 工具包）是给国内本机构建用的；
      # CI 在境外，依赖 tarball 与二进制都在 npmmirror 上，反而慢——删掉让它走官方源
      - name: 移除国内镜像配置
        shell: bash
        run: rm -f .npmrc
      - name: 安装构建期依赖
        run: npm install --registry=https://registry.npmjs.org/ --replace-registry-host=always --no-audit --no-fund
      # electronDownload.mirror 固化在 electron-builder.yml 里（electron-builder 不读 ELECTRON_MIRROR，
      # 只认这个键），CI 上覆盖回官方源
      - name: 打包 GUI 产物
        run: npm run dist -- --config.electronDownload.mirror=https://github.com/electron/electron/releases/download/
      # dmg 转 ULMO（LZMA）：UDBZ（bzip2）压不进 100 MB 的 dmg-x64（v1.1.2 实测 102.5 MB），
      # LZMA 能压进去。不配在 electron-builder.yml——builder 的 schema 白名单没有 ULMO
      #（dmg.format 只收六种、additionalProperties: false，实测直接拒配置），所以出完 UDBZ
      # 后用系统 hdiutil convert 换格式（换完删掉 UDBZ 原件，别让它混进附件）。挂载要求
      # macOS 10.15+，GitHub Desktop 3.6.x 最低支持 macOS 12，覆盖所有受支持的系统。
      - name: dmg 转 ULMO
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          for f in dist/gui/*.dmg; do
            [ -e "$f" ] || continue
            tmp="${f%.dmg}.ulmo.dmg"
            hdiutil convert "$f" -format ULMO -o "$tmp"
            mv "$tmp" "$f"
            echo "已转 ULMO：$f（$(du -h "$f" | cut -f1)）"
          done
      - name: 产物自检
        run: node tools/check-gui-dist.js
      # 产物启动冒烟：真的把产物起一次，确认窗口与界面能加载——静态自检看不出「删掉的组件是不是
      # 启动必需的」。判据与输出见 gui/main.js 的 --smoke-test（窗口尺寸 / 工具栏按钮数 /
      # 标签页数 / 「翻译提示词」取到文本 / 「关于」能开 / IPC 往返——无参通道一条、带参通道一条
      # （后者的判据是**实参形态**：处理器拿到的必须是业务参数本身，而不是 IpcMainInvokeEvent）），
      # 失败或 30 秒超时都会打印 SMOKE_FAIL 并以非 0 退出。**四个 runner 都没有 GPU**，正好打在
      # 「软渲染组件删掉后还有没有回退路径」这条风险链上（裁剪清单见 build/after-pack.js）。
      - name: 产物启动冒烟
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: |
          # GUI 子系统程序的 stdout 用 & 调不出来（PowerShell 既不等待也不捕获），必须 Start-Process 重定向
          $out = "$env:RUNNER_TEMP\smoke.txt"
          $p = Start-Process -FilePath "dist\gui\win-unpacked\GitHubDesktopZhTool.exe" `
               -ArgumentList '--smoke-test' -PassThru -Wait `
               -RedirectStandardOutput $out -RedirectStandardError "$out.err"
          Get-Content $out -ErrorAction SilentlyContinue
          Get-Content "$out.err" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Error "产物启动冒烟失败（退出码 $($p.ExitCode)）"; exit 1 }
      - name: 产物启动冒烟
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 5
        run: |
          # 直接执行 .app 里的可执行文件，不走 open（绕开 LaunchServices，输出与退出码都是自己的）；
          # runner 有 WindowServer 用户会话，能真的开窗
          APP=$(find dist/gui -maxdepth 2 -name '*.app' -print -quit)
          [ -n "$APP" ] || { echo "没找到 .app"; exit 1; }
          echo "启动：$APP"
          "$APP/Contents/MacOS/GitHubDesktopZhTool" --smoke-test
      - name: 产物启动冒烟
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 5
        run: |
          # runner 没有显示：xvfb 提供虚拟 X；容器里 Chromium 沙箱开不起来、/dev/shm 也偏小，两个开关都关掉
          EXE=dist/gui/linux-unpacked/GitHubDesktopZhTool
          [ -x "$EXE" ] || { echo "找不到可执行文件"; ls -l dist/gui/linux-unpacked | head -20; exit 1; }
          xvfb-run -a "$EXE" --no-sandbox --disable-dev-shm-usage --smoke-test
      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: gui-${{ matrix.os }}
          # 只收最终产物，不收 win-unpacked / mac / linux-unpacked 这些中间目录
          path: |
            dist/gui/*.exe
            dist/gui/*.7z
            dist/gui/*.dmg
            dist/gui/*.AppImage
            dist/gui/*.deb
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: [build, gui]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45        # 上传卡死时的兜底：附件传完只需几分钟，超过这个数多半是传输卡住了
    env:
      # darwin→macos 平台词的过渡开关：v1.1.2 及更早装出去的工具只匹配 -darwin- 词，
      # 本次 Release 的 mac 附件要多挂一份 darwin 名的拷贝（SHA256SUMS 里双名字各一行）。
      # **下一版发版时把它改成 'false'**（附件翻倍 ~200 MB，只过渡一版），届时
      # scripts/update.js 的 darwin 兜底保留、这个复制步骤与开关一并删除。
      TRANSITION_DARWIN_ALIASES: 'true'
    permissions:
      contents: write         # 附件传输走内置 token（PAT 传附件实测卡死）；Release 本身仍由 RELEASE_TOKEN 创建
    steps:
      - uses: actions/checkout@v7     # 只为读 CHANGELOG.md，不需要完整历史
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: 生成 darwin 过渡附件（仅本次）
        if: env.TRANSITION_DARWIN_ALIASES == 'true'
        working-directory: dist
        run: |
          for f in *-macos-*; do
            [ -e "$f" ] || continue
            cp "$f" "${f/-macos-/-darwin-}"
            echo "过渡附件：$f -> ${f/-macos-/-darwin-}"
          done
      - name: 生成 SHA256 校验和
        working-directory: dist
        run: sha256sum github-desktop-zh-cn-* > SHA256SUMS
      - name: 生成 Release 正文（取自 CHANGELOG.md 对应段落）
        run: node tools/changelog.js "${GITHUB_REF_NAME#v}" > notes.md
      - name: 检查发布令牌
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          # Release 用作者本人的 PAT 创建：内置 GITHUB_TOKEN 建出来的 Release 署名是
          # github-actions[bot]，观感上不像作者发布（且作者事后无法修改，只能删了重建）。
          # 没配 secret 时在这里给出可读原因，免得后面报一句看不懂的 401。
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::未配置 RELEASE_TOKEN secret——Release 须由作者身份创建，配置方法见 \`docs/agents/发版.md\`"
            exit 1
          fi
      - name: 创建 Release
        env:
          # 控制面（建 / 改 Release）走作者的 PAT，署名才是作者本人；数据面（附件传输）走内置 token。
          # 拆开是因为实测 PAT 传附件一律卡死：v0.2.0 三次尝试分别跑 606s / 1657s / 939s 后失败，
          # 注解点名卡在 107 MB 的单文件产物上；而内置 token 历史上传过 5 个附件共 420 MB
          #（v0.1.0 只用 97 秒）——附件上传者字段可查，见 `docs/agents/发版.md`。
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 只创建缺失的：已发布的 Release 与它的正文都不再改动。
          # 草稿则是上一次跑到一半被中断留下的残骸（gh release create 先建草稿、传完附件才发布）——
          # 续用它：已经传上去的附件不重传（1.4 GB 一次传不完时，靠重跑补齐），
          # 发布前再把不属于本次构建的遗留附件删掉，末端状态与「删掉重建」等价。
          # **但只复用自己人建的草稿**：署名在建 Release 的那一刻就定了，之后改不了（update 接口
          # 没有 author 字段）——复用内置 token 建出来的草稿，最后发布的 Release 仍署名
          # github-actions[bot]，等于白拆一遍令牌。作者对不上就删掉重建（不带 --cleanup-tag，tag 保留）。
          create_draft() {
            GH_TOKEN="$RELEASE_TOKEN" gh release create "$GITHUB_REF_NAME" --draft \
              --title "$GITHUB_REF_NAME" \
              --notes-file notes.md
          }

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = "true" ]; then
              pat_login="$(GH_TOKEN="$RELEASE_TOKEN" gh api user --jq .login 2>/dev/null || true)"
              author="$(GH_TOKEN="$RELEASE_TOKEN" gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .author.login 2>/dev/null || true)"
              if [ -n "$pat_login" ] && [ "$author" = "$pat_login" ]; then
                echo "复用上次中断留下的草稿 Release（作者 $author），已传的附件不重传"
              else
                echo "草稿的作者是 ${author:-未知}，不是发布令牌身份（${pat_login:-未知}）——删掉重建，署名才对得上"
                gh release delete "$GITHUB_REF_NAME" --yes
                create_draft
              fi
            else
              echo "Release $GITHUB_REF_NAME 已发布，跳过"
              exit 0
            fi
          else
            create_draft
          fi

          # 逐个上传、互不牵连：一次性 gh release create dist/* 是串行传完所有附件、任一失败整条作废；
          # 而「第一个失败就中断」会让后面的附件连试都没试过。失败原因写进 ::error:: 注解——
          # 注解匿名可读（job 日志要仓库权限），出问题时不必进网页翻日志。
          failed=""
          for f in dist/*; do
            name="$(basename "$f")"
            # 判据用 sha256 而不是文件大小：远端附件的 digest 字段就是上传内容的 sha256，
            # 逐字节等价的才跳过。大小相同、内容不同（旧提交的产物恰好同尺寸）不会被误当成已传。
            # digest 为空（老式上传的附件）时判不等 → 重传，偏向安全的那一侧。
            want="$(sha256sum "$f" | cut -d' ' -f1)"
            have="$(gh release view "$GITHUB_REF_NAME" --json assets --jq ".assets[] | select(.name == \"$name\") | (.digest // \"\")" 2>/dev/null || true)"
            if [ "$have" = "sha256:$want" ]; then
              echo "草稿里已有且内容一致，跳过：$name"
              continue
            fi
            ok=""
            for attempt in 1 2 3; do
              if out="$(timeout 1200 gh release upload "$GITHUB_REF_NAME" "$f" --clobber 2>&1)"; then
                echo "已上传 $name（$(du -h "$f" | cut -f1)）"
                ok=1
                break
              fi
              detail="$(printf '%s' "$out" | tr '\n' ' ' | tr -d '\r' | tail -c 200)"
              if [ "$attempt" -lt 3 ]; then
                echo "附件 $name 第 $attempt 次上传失败，15 秒后重试：$detail"
                sleep 15
              else
                echo "附件 $name 第 $attempt 次上传失败：$detail"
              fi
            done
            if [ -z "$ok" ]; then
              failed="$failed $name"
              echo "::error::附件 $name 上传失败：$(printf '%s' "$out" | tr '\n' ' ' | tr -d '\r' | tail -c 300)"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::本次未能上传：$failed（重跑即可续传，已传成功的不会重来）"
            exit 1
          fi

          # 清掉草稿里不属于本次构建的附件（上一次中断留下的旧产物），再发布
          for name in $(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' 2>/dev/null || true); do
            if [ ! -f "dist/$name" ]; then
              echo "删除不属于本次构建的遗留附件：$name"
              gh release delete-asset "$GITHUB_REF_NAME" "$name" --yes
            fi
          done

          GH_TOKEN="$RELEASE_TOKEN" gh release edit "$GITHUB_REF_NAME" --draft=false --notes-file notes.md
          echo "Release $GITHUB_REF_NAME 已发布，附件 $(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length') 个"

      # 同步到 Gitee。放在 GitHub Release 发布**之后**：Gitee 是镜像渠道，它出问题不该
      # 影响权威源的成果（下面失败时只让 job 标红，已发布的 GitHub Release 原样保留）。
      #
      # **最新版传全套附件**（v1.1.3 起，产物压缩后单文件 ≤ 100 MB 的 Gitee 上限）：
      #   - 附件配额是「单仓库合计 1 GB」，只装得下最新一版（压缩后约 842 MB + 过渡版翻倍的
      #     mac 侧 ~200 MB 超限，故 **darwin 过渡附件不进 Gitee**，只在 GitHub 上）；Gitee 的
      #     旧版本 Release 删掉附件、正文补 GitHub 下载链接，配额让给最新版。
      #   - SHA256SUMS 一并上传——Gitee 侧从此也有校验和清单，自更新对两个来源走同一套校验。
      #   - 重跑幂等：按 sha256 判等，已传的不重传，缺的补传（Gitee 上传接口没有 digest，
      #     用「名字 + 大小」判存在、大小一致视为已传）。
      - name: 发布到 Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::warning::未配置 GITEE_TOKEN，跳过 Gitee 发布——Gitee 上不会有 $GITHUB_REF_NAME 的发行版"
            exit 0
          fi

          API="https://gitee.com/api/v5/repos/$GITHUB_REPOSITORY"
          AUTH="Authorization: Bearer $GITEE_TOKEN"
          TAG="$GITHUB_REF_NAME"

          # 探测：Gitee 用 HTTP 200 + 字面量 null 表示「该 tag 没有发行版」，**不是 404**——
          # 照搬 GitHub 的判据会把「不存在」当成「查询失败」。实测见 docs/design/dict-v2/tasks.md 6.x。
          existing="$(curl -sfS -m 30 -H "$AUTH" "$API/releases/tags/$TAG" || echo null)"
          rid="$(printf '%s' "$existing" | jq -r 'if type=="object" then (.id // empty) else empty end' 2>/dev/null || true)"

          if [ -z "$rid" ]; then
            # 正文 = CHANGELOG 段落 + 下载指引
            {
              cat notes.md
              printf '\n\n---\n\n构建产物以本页附件为准；若附件缺失，请到 GitHub Release 下载：\n\n'
              printf 'https://github.com/%s/releases/tag/%s\n' "$GITHUB_REPOSITORY" "$TAG"
            } > gitee-notes.md

            # payload 走文件、**不走命令行参数**：Windows 版 curl 会把 argv 里的非 ASCII 转成
            # 本地代码页（实测中文变 GBK 字节发出去，Gitee 上正文成乱码，而报错里看不出线索）；
            # --data-binary @文件 不经过 argv，两个平台行为一致。
            jq -n --arg t "$TAG" --rawfile b gitee-notes.md \
              '{tag_name:$t, name:$t, body:$b, target_commitish:"main", prerelease:false}' > gitee-payload.json
            resp="$(curl -sfS -m 60 -X POST "$API/releases" -H "$AUTH" \
              -H "Content-Type: application/json" --data-binary @gitee-payload.json 2>&1 || true)"
            rid="$(printf '%s' "$resp" | jq -r '.id // empty' 2>/dev/null || true)"
            if [ -z "$rid" ]; then
              echo "::error::在 Gitee 创建 $TAG 的发行版失败：$(printf '%s' "$resp" | tr '\n' ' ' | tail -c 300)"
              exit 1
            fi
            echo "已在 Gitee 创建发行版（id=$rid）：https://gitee.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          fi

          # —— 附件配额交接：把**其它** Release 的附件删掉、正文补上 GitHub 下载链接 ——
          # Gitee 附件配额单仓库合计 1 GB，只装得下最新一版。列全量 Release 逐个处理，
          # 本 tag 跳过。删除**已发布的**旧版附件是本策略的设计使然（旧版正文有 GitHub 链接兜底）。
          page=1
          while :; do
            list="$(curl -sfS -m 30 -H "$AUTH" "$API/releases?page=$page&per_page=20" || echo '[]')"
            count="$(printf '%s' "$list" | jq 'length')"
            [ "$count" -gt 0 ] || break
            for r in $(printf '%s' "$list" | jq -r '.[].id'); do
              [ "$r" = "$rid" ] && continue
              rtag="$(printf '%s' "$list" | jq -r --argjson i "$r" '.[] | select(.id==$r) | .tag_name')"
              # 删附件
              for f in $(curl -sfS -m 30 -H "$AUTH" "$API/releases/$r/attach_files" | jq -r '.[].id' 2>/dev/null || true); do
                echo "清配额：删旧版 $rtag 的附件 #$f"
                curl -sfS -m 60 -X DELETE -H "$AUTH" "$API/releases/$r/attach_files/$f" >/dev/null || \
                  echo "::warning::旧版 $rtag 附件 #$f 删除失败（配额可能被占用，最新版附件或许传不上）"
              done
              # 正文补 GitHub 链接（幂等：已含链接就不再改）
              body="$(curl -sfS -m 30 -H "$AUTH" "$API/releases/$r" | jq -r '.body')"
              gh_url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$rtag"
              if printf '%s' "$body" | grep -qF "$gh_url"; then continue; fi
              jq -n --arg b "$(printf '%s\n\n---\n\n本页附件已清理（配额让给最新版），请到 GitHub Release 下载：\n%s' "$body" "$gh_url")" \
                '{body:$b}' > gitee-body-patch.json
              curl -sfS -m 60 -X PATCH "$API/releases/$r" -H "$AUTH" \
                -H "Content-Type: application/json" --data-binary @gitee-body-patch.json >/dev/null || \
                echo "::warning::旧版 $rtag 正文补链接失败"
              echo "旧版 $rtag：附件已清，正文补上 GitHub 下载链接"
            done
            page=$((page+1))
            [ "$page" -gt 10 ] && break   # 配额交接只做 10 页，防御分页异常
          done

          # —— 传附件：逐个上传、按「名字 + 大小」判等补传 ——
          # Gitee 附件单文件上限 100 MB：超限的（不该有——产物已压缩；若出现说明体积回涨）
          # 跳过并在正文有 GitHub 链接兜底的前提下如实报错，不让整条发布链断在这一个文件上。
          failed=""
          for f in dist/github-desktop-zh-cn-*; do
            name="$(basename "$f")"
            case "$name" in *-darwin-*) echo "跳过过渡附件（只在 GitHub）：$name"; continue;; esac
            size="$(stat -c%s "$f")"
            if [ "$size" -ge $((100 * 1024 * 1024)) ]; then
              echo "::error::附件 $name 达 $((size / 1024 / 1024)) MB，超出 Gitee 单文件 100 MB 上限——产物体积回涨了，先修体积再发版"
              failed="$failed $name"
              continue
            fi
            # 已存在且大小一致 → 跳过（幂等重跑）；名字在、大小不一致 → 删了重传
            have_id="$(curl -sfS -m 30 -H "$AUTH" "$API/releases/$rid/attach_files" | jq -r --arg n "$name" '.[] | select(.name==$n) | "\(.id) \(.size)"' 2>/dev/null | head -1 || true)"
            if [ "$(printf '%s' "$have_id" | awk '{print $2}')" = "$size" ]; then
              echo "Gitee 上已有且大小一致，跳过：$name"
              continue
            fi
            if [ -n "$have_id" ]; then
              old_id="$(printf '%s' "$have_id" | awk '{print $1}')"
              echo "Gitee 上已有同名但大小不符，删除重传：$name（#$old_id）"
              curl -sfS -m 60 -X DELETE -H "$AUTH" "$API/releases/$rid/attach_files/$old_id" >/dev/null || true
            fi
            ok=""
            for attempt in 1 2 3; do
              if out="$(curl -sS -m 1200 -X POST "$API/releases/$rid/attach_files" -H "$AUTH" \
                -F "file=@$f" 2>&1)"; then
                echo "已上传 $name（$((size / 1024 / 1024)) MB）"
                ok=1
                break
              fi
              detail="$(printf '%s' "$out" | tr '\n' ' ' | tr -d '\r' | tail -c 200)"
              if [ "$attempt" -lt 3 ]; then
                echo "附件 $name 第 $attempt 次上传失败，15 秒后重试：$detail"
                sleep 15
              else
                echo "附件 $name 第 3 次上传失败：$detail"
              fi
            done
            if [ -z "$ok" ]; then
              failed="$failed $name"
              echo "::error::附件 $name 上传 Gitee 失败：$(printf '%s' "$out" | tr '\n' ' ' | tr -d '\r' | tail -c 300)"
            fi
          done

          # SHA256SUMS 一并传（Gitee 侧从此也有校验和清单）
          if [ -f dist/SHA256SUMS ]; then
            sums_name="SHA256SUMS"
            sums_size="$(stat -c%s dist/SHA256SUMS)"
            have_id="$(curl -sfS -m 30 -H "$AUTH" "$API/releases/$rid/attach_files" | jq -r --arg n "$sums_name" '.[] | select(.name==$n) | "\(.id) \(.size)"' 2>/dev/null | head -1 || true)"
            if [ "$(printf '%s' "$have_id" | awk '{print $2}')" != "$sums_size" ]; then
              [ -n "$have_id" ] && curl -sfS -m 60 -X DELETE -H "$AUTH" "$API/releases/$rid/attach_files/$(printf '%s' "$have_id" | awk '{print $1}')" >/dev/null || true
              curl -sS -m 120 -X POST "$API/releases/$rid/attach_files" -H "$AUTH" -F "file=@dist/SHA256SUMS" >/dev/null \
                && echo "已上传 SHA256SUMS" || echo "::warning::SHA256SUMS 上传 Gitee 失败（自更新在 Gitee 来源会跳过校验和比对，不阻断）"
            else
              echo "Gitee 上已有 SHA256SUMS，跳过"
            fi
          fi

          if [ -n "$failed" ]; then
            echo "::error::本次未能上传 Gitee：$failed（重跑即可续传，已传成功的不会重来）"
            exit 1
          fi
          echo "Gitee 发行版已就绪：https://gitee.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
