# repair-release.yml — 修已发布的 Release（删了重建），手动触发
#
# 为什么需要它：Release 的**署名**在建的那一刻就定死（update 接口没有 author 字段），
# 正文与标题也不能靠重跑 CI 改（build.yml 的发布步骤对已发布的 Release 直接跳过）。
# 于是「换署名」「改产物名重发」「改正文」这类事只剩一条路：先删、再重建。
# 本流程把那件事做成按钮，免得每次手敲一串 gh 命令时漏掉某个附件。
#
# 两个任务（都**只动 Release、不动 tag**）：
#   restore-release —— 备份（附件 + 标题 + 正文）→ 删 → 用 RELEASE_TOKEN 以同一 tag 重建
#                      → 用内置 token 逐个回传**同样字节**的附件 → 核对署名与附件名单
#                      用途：修署名（v0.1.0 / v0.1.1 的 Release 当年是内置 token 建的，
#                      署名 github-actions[bot]，见 AGENTS.md「发版」）
#                      **正文以 CHANGELOG.md 的对应条目为准**（与 build.yml 同一来源），
#                      条目取不到才沿用现网 Release 那份快照——改了 CHANGELOG 再跑一次，
#                      正文就跟着变（v0.1.0 / v0.1.1 开头补引用块就是这么补的）
#   delete-release  —— 只删 Release（不带 --cleanup-tag，tag 保留），随后强推 tag 即可让 CI
#                      用新命名 / 新正文重发。用途：修产物与正文（v0.2.0 的 cli / gui 命名
#                      与正文引用块就是这么修的）
#
# `confirm` 必须与 `tag` 逐字相同——两个任务都会让该版本的下载页短暂消失，防的是手滑。
# 控制面（建 / 改 Release）走 RELEASE_TOKEN、数据面（附件传输）走内置 GITHUB_TOKEN，
# 与 build.yml 同一套纪律；附件传输用 PAT 会卡死，见 AGENTS.md「发版」一节。
#
# **控制面一律用 build.yml 里跑通过的那几条命令**（gh release create / edit / delete）：
# 更新 Release 的接口只认**数字 id**（`PATCH /repos/{o}/{r}/releases/{release_id}`，文档里
# release_id 就一句「The unique identifier of the release.」；传 tag 名是 404——实测过
# `GET /releases/<tag>` 也是 404，只有 `/releases/tags/<tag>` 这个独立端点收 tag、且只支持 GET）。
# v0.1.0 / v0.1.1 的两次修复就是栽在这条上：步骤 exit 1 却没有任何 ::error:: 注解，
# 因为出错的那行是我手拼的 tag 形式 PATCH。本文件里每个控制面命令都包了错误输出。
#
# 兜底：备份在删之前先传成 Artifacts（`release-backup-<tag>`，留 30 天）。万一回传失败，
# 附件字节还在——重跑 `restore-release` 即可续传。同理，若上一次修复删了却没建回来
# （该 tag 眼下没有 Release），也这么重跑：备份步骤认「没有现网 Release」这条路，
# 自己去找同名的那份备份（不用手抄运行 id），从里面取字节把 Release 建回来。
# 想指定用哪一份，才填 `backup_run_id`。

name: 修复已发布 Release

run-name: 修复 ${{ inputs.tag }}（${{ inputs.task }}）

on:
  workflow_dispatch:
    inputs:
      task:
        description: 要做的事
        type: choice
        required: true
        default: restore-release
        options:
          - restore-release   # 备份 → 删 → 以同一 tag 重建（修署名）
          - delete-release    # 只删 Release、保留 tag（修产物与正文的前置步骤）
      tag:
        description: 目标 tag（形如 v0.2.0）
        type: string
        required: true
      confirm:
        description: 原样再填一次上面的 tag，确认知道自己在改已发布的 Release
        type: string
        required: true
      backup_run_id:
        description: （可选，仅 restore-release）指定用哪次运行的备份；留空则优先取现网 Release，没有就自己找同名备份
        type: string
        required: false

# 同一个 tag 的修复不许并行跑——两个运行同时删 / 建，只会得到一个附件不全的 Release
concurrency:
  group: repair-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45        # 与 build.yml 的发版 job 同量级：附件传完只需几分钟，超过这么多半是卡住了
    permissions:
      contents: write         # 附件传输走内置 token（PAT 传附件实测卡死）
      actions: read           # 续传要从上一次运行的 Artifacts 取字节（gh run download 走的是 /actions/ 接口）。
                              # 注意：显式写 permissions 会把没列出的权限清零——少了这条，兜底续传必 403
    env:
      GH_REPO: ${{ github.repository }}   # runner 上没有仓库工作区，gh 只能靠这个变量定位仓库
      TAG: ${{ inputs.tag }}
    steps:
      - name: 校验输入
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          # confirm 与 tag 逐字相同才会动手：这一步防的是「想修 v0.1.0，手滑填成 v0.2.0」
          if [ "$CONFIRM" != "$TAG" ]; then
            echo "::error::confirm（$CONFIRM）与 tag（$TAG）不一致——原样再填一次 tag 才会动手"
            exit 1
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag 形如 v0.2.0（收到：$TAG）"
            exit 1
          fi
          echo "当前 Latest：$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>/dev/null || echo 无)" | tee prev-latest.txt

      # 仓库工作区：只为两件事——gh 在有 git 仓库的目录里跑（与 build.yml 一致），
      # 以及「现网 Release 已不在」时用 CHANGELOG.md 现生成正文
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0      # 连 tag 一起取全，gh release 系列要靠它认出 tag 已存在

      - name: 备份目标 Release（标题 + 正文 + 全部附件）
        if: ${{ success() && inputs.task == 'restore-release' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
        run: |
          mkdir -p backup
          # 查现网有没有这个 Release **用 PAT**（作者本人的身份）：草稿的可见性有边界，
          # 查漏了会让流程误以为「没有 Release」而去新建，撞 already_exists 白跑一趟。
          # PAT 没配才退回内置 token。查到的字节随后仍用内置 token 下载（数据面）。
          rel_token="${RELEASE_TOKEN:-$GH_TOKEN}"
          # 先看现网有没有这个 Release。可能没有——上一次修复删掉后没建回来，那种情形也得能接着干：
          # 字节改从 backup_run_id 那份 Artifacts 里取（下面分支）。
          if GH_TOKEN="$rel_token" gh api "repos/$GH_REPO/releases/tags/$TAG" > release.json 2> api-error.txt; then
            jq -j 'if (.title // "") == "" then .tag_name else .title end' release.json > title.txt
            jq -j '.body // ""' release.json > notes-release.md
            echo "目标：$(jq -r '.tag_name' release.json)，标题「$(cat title.txt)」，草稿=$(jq -r '.draft' release.json)，署名=$(jq -r '.author.login' release.json)，附件 $(jq '.assets | length' release.json) 个"
          else
            rm -f release.json
            : > title.txt
            : > notes-release.md
            echo "::warning::$TAG 眼下没有 Release：$(tr '\n' ' ' < api-error.txt | tail -c 200)"
          fi

          # 正文取自 CHANGELOG.md 的对应条目——与 build.yml 的发版步骤同一来源。现网 Release 上那份
          # 只是它发布时的快照；而且「现网没有 Release」那条重建路一直就是用 CHANGELOG 现生成的，
          # 同一个流程的两条路不该对正文从哪来有两种说法。条目找不到（老版本、条目被删）才退回快照。
          : > notes.md
          if [ -f scripts/changelog.js ] && node scripts/changelog.js "${TAG#v}" > notes-changelog.md 2> changelog-error.txt; then
            cp notes-changelog.md notes.md
            echo "正文取自 CHANGELOG.md 的 ${TAG#v} 条目（$(wc -l < notes.md) 行）"
            if [ -s notes-release.md ] && [ "$(sha256sum < notes.md)" != "$(sha256sum < notes-release.md)" ]; then
              echo "::notice::CHANGELOG.md 的条目与现网 Release 的正文不同——本次以 CHANGELOG.md 为准重建正文"
            fi
          elif [ -s notes-release.md ]; then
            cp notes-release.md notes.md
            echo "::warning::CHANGELOG.md 里没有 ${TAG#v} 的条目，正文沿用现网 Release 那份：$(tr '\n' ' ' < changelog-error.txt | tail -c 160)"
          fi

          # 都没给、现网也没有：自己去找同名的那份备份 Artifact（保留 30 天）——
          # 「还得手抄运行 id」这件事没人记得住，能找到就自己找
          if [ -z "$BACKUP_RUN_ID" ] && [ ! -f release.json ]; then
            echo "现网没有 $TAG 的 Release，也没给 backup_run_id——去找名为 release-backup-$TAG 的备份"
            # 走内置 token 的 actions: read（上面的 permissions）取 /actions/artifacts，
            # 按 created_at 取最近一份**没过期**的，再从它的 workflow_run.id 找回那次运行
            arts="$(gh api "repos/$GH_REPO/actions/artifacts?name=release-backup-$TAG&per_page=100" 2> art-error.txt || true)"
            BACKUP_RUN_ID="$(printf '%s' "$arts" | jq -r '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .workflow_run.id // empty' 2>/dev/null || true)"
            if [ -n "$BACKUP_RUN_ID" ]; then
              echo "找到最近一份可用的备份，来路 run $BACKUP_RUN_ID"
            else
              BACKUP_RUN_ID=""
              # 把原始返回一并塞进注解：注解匿名可读而 job 日志不行，这样下次谁看都能一眼分清
              # 「确实没有备份」还是「这条查询本身出错（限额 / 权限 / 字段改名）」
              echo "::error::$TAG 眼下没有 Release，也没有名为 release-backup-$TAG 的可用备份——没有字节可回传。**没有删任何东西**。要么等该 tag 的产物重建后再发，要么人工确认那份备份是否已过期（保留 30 天）。查询返回：$(printf '%s' "$arts" | tr -d '\n' | head -c 240)$(tr -d '\n' < art-error.txt 2>/dev/null | head -c 120)"
              exit 1
            fi
          fi

          if [ -n "$BACKUP_RUN_ID" ]; then
            # 从指定运行的 Artifacts 取字节——上次没传完 / 上次把 Release 删没了时走这条，
            # 拿到的是**当初那份**完整备份
            echo "附件字节取自 run $BACKUP_RUN_ID 的备份"
            if ! out="$(gh run download "$BACKUP_RUN_ID" -n "release-backup-$TAG" -D backup 2>&1)"; then
              echo "::error::从 run $BACKUP_RUN_ID 取名为 release-backup-$TAG 的 Artifact 失败（运行 id 或名字不对？）：$(printf '%s' "$out" | tr '\n' ' ' | tail -c 300)"
              exit 1
            fi
          elif [ -f release.json ]; then
            if ! out="$(gh release download "$TAG" --dir backup --clobber 2>&1)"; then
              echo "::error::下载附件失败：$(printf '%s' "$out" | tr '\n' ' ' | tail -c 300)"
              exit 1
            fi
          fi

          if [ -z "$(ls -A backup)" ]; then
            echo "::error::备份目录是空的——一个附件都没拿到，**没有删任何东西**"
            exit 1
          fi

          # 删之前必须确认备份完整：附件个数对得上，且每个附件的 sha256 与远端的 digest 一致
          #（digest 为空的老式上传退回比字节数）。没有现网 Release 可比对时，按备份自己造清单。
          if [ -f release.json ]; then
            expect="$(jq '.assets | length' release.json)"
            have="$(find backup -maxdepth 1 -type f | wc -l)"
            if [ "$expect" != "$have" ]; then
              echo "::error::备份到 $have 个文件，Release 上有 $expect 个附件——**没有删任何东西**，先查明原因再重跑"
              exit 1
            fi
            jq -r '.assets[] | "\(.name)\t\(.size)\t\(.digest // "")"' release.json > assets.tsv
            trouble=""
            while IFS="$(printf '\t')" read -r name size digest; do
              f="backup/$name"
              if [ ! -f "$f" ]; then
                echo "::error::附件 $name 没下载下来"
                trouble=1
                continue
              fi
              if [ -z "$digest" ]; then
                if [ "$(stat -c%s "$f")" != "$size" ]; then
                  echo "::error::$name 字节数不符（Release $size，备份 $(stat -c%s "$f")）"
                  trouble=1
                else
                  echo "（$name 远端没有 sha256 记录，按字节数核对通过）"
                fi
              elif [ "$digest" != "sha256:$(sha256sum "$f" | cut -d' ' -f1)" ]; then
                echo "::error::$name 校验和不符（远端 $digest）"
                trouble=1
              fi
            done < assets.tsv
            if [ -n "$trouble" ]; then
              echo "::error::备份不完整，**没有删任何东西**，先查明原因再重跑"
              exit 1
            fi
          else
            echo "没有现网 Release 可比对——按备份里的字节自己造一份清单："
            : > assets.tsv
            for f in backup/*; do
              printf '%s\t%s\tsha256:%s\n' "$(basename "$f")" "$(stat -c%s "$f")" "$(sha256sum "$f" | cut -d' ' -f1)" >> assets.tsv
            done
            cut -f1 assets.tsv | sed 's/^/  - /'
          fi
          sha256sum backup/* | tee backup-sha256.txt

      - name: 存档备份（Artifacts）
        if: ${{ success() && inputs.task == 'restore-release' && inputs.backup_run_id == '' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-backup-${{ inputs.tag }}
          path: backup/
          retention-days: 30

      - name: 删掉旧 Release，以同一 tag 重建（署名走 RELEASE_TOKEN）
        if: ${{ success() && inputs.task == 'restore-release' }}
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::未配置 RELEASE_TOKEN secret——署名要落到作者本人就得用它，配置方法见 AGENTS.md「发版」一节"
            exit 1
          fi
          if ! pat_login="$(GH_TOKEN="$RELEASE_TOKEN" gh api user --jq .login 2>&1)"; then
            echo "::error::用 RELEASE_TOKEN 取不到身份（过期 / 被撤销 / 权限不足？）：$(printf '%s' "$pat_login" | tr '\n' ' ' | tail -c 200)"
            exit 1
          fi
          echo "发布令牌身份：$pat_login"

          # 三种现状分别处理：
          #   没有 release.json      → 现网没这个 Release，直接新建（多半是上一次修复删了没建回来）
          #   已是自己建的草稿        → 复用，别删——删了附件要重传一遍（发布那步失败就会留下这个状态）
          #   其余（公开的 / 别人建的）→ 删掉重建，署名才换得掉
          need_create=""
          if [ ! -f release.json ]; then
            echo "现网没有 $TAG 的 Release——直接新建"
            need_create=1
          else
            author="$(jq -r '.author.login' release.json)"
            was_draft="$(jq -r '.draft' release.json)"
            if [ "$was_draft" = "true" ] && [ "$author" = "$pat_login" ]; then
              echo "目标是草稿且署名已是 $pat_login——复用，不删"
            else
              echo "删除现有 Release（不带 --cleanup-tag：tag 保留；原署名 $author，草稿=$was_draft）"
              if ! out="$(GH_TOKEN="$RELEASE_TOKEN" gh release delete "$TAG" --yes 2>&1)"; then
                echo "::error::删除失败：$(printf '%s' "$out" | tr '\n' ' ' | tail -c 300)"
                exit 1
              fi
              need_create=1
            fi
          fi

          if [ -n "$need_create" ]; then
            # 标题：现网 Release 还在时原样沿用，已不在时退回 tag 名。正文已在上一步定好（CHANGELOG 优先）。
            if [ ! -s title.txt ]; then printf '%s' "$TAG" > title.txt; fi
            if [ ! -s notes.md ]; then
              printf '%s\n' "本版正文未能取回。附件是发布时的原始字节，校验和见 SHA256SUMS。" > notes.md
            fi
            # 先建**草稿**：草稿对使用者不可见，附件不全时没人看得到一个残缺的下载页。
            # 命令形状与 build.yml 的发版步骤一致（那边跑通过），差别只在署名令牌。
            if ! out="$(GH_TOKEN="$RELEASE_TOKEN" gh release create "$TAG" --draft --title "$(cat title.txt)" --notes-file notes.md 2>&1)"; then
              echo "::error::建草稿失败：$(printf '%s' "$out" | tr '\n' ' ' | tail -c 300)"
              exit 1
            fi
            echo "已建草稿：$(printf '%s' "$out" | head -1)"
          fi

          # 复用草稿这条路不重建草稿，里面那份正文可能还是旧的——正文以 CHANGELOG.md 为准，
          # 这里统一对齐一次；失败不致命，下面发布那步还会再带一次 --notes-file。
          if ! out="$(GH_TOKEN="$RELEASE_TOKEN" gh release edit "$TAG" --notes-file notes.md 2>&1)"; then
            echo "::warning::更新正文失败：$(printf '%s' "$out" | tr '\n' ' ' | tail -c 200)"
          fi

          # 逐个上传、互不牵连：失败原因进 ::error:: 注解（匿名可读），已传成功的重跑时按 digest 跳过
          failed=""
          for f in backup/*; do
            name="$(basename "$f")"
            want="$(sha256sum "$f" | cut -d' ' -f1)"
            have="$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq ".assets[] | select(.name == \"$name\") | (.digest // \"\")" 2>/dev/null || true)"
            if [ "$have" = "sha256:$want" ]; then
              echo "已在 Release 上且内容一致，跳过：$name"
              continue
            fi
            ok=""
            for attempt in 1 2 3; do
              if out="$(timeout 1200 gh release upload "$TAG" "$f" --clobber 2>&1)"; then
                echo "已回传 $name（$(du -h "$f" | cut -f1)）"
                ok=1
                break
              fi
              detail="$(printf '%s' "$out" | tr '\n' ' ' | tr -d '\r' | tail -c 200)"
              if [ "$attempt" -lt 3 ]; then
                echo "附件 $name 第 $attempt 次回传失败，15 秒后重试：$detail"
                sleep 15
              else
                echo "附件 $name 第 $attempt 次回传失败：$detail"
              fi
            done
            if [ -z "$ok" ]; then
              failed="$failed $name"
              echo "::error::附件 $name 回传失败：$(printf '%s' "$out" | tr '\n' ' ' | tr -d '\r' | tail -c 300)"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::本次未能回传：$failed。Release 仍是**草稿**（使用者看不见），附件字节在本次运行的 Artifacts 里——带上 backup_run_id=$GITHUB_RUN_ID 重跑本流程即可续传"
            exit 1
          fi

          # 发布：草稿转正。用 gh release edit（build.yml 里跑通过的那条）；万一它失败，
          # 退回 id 形式的 PATCH——**注意是数字 id**，tag 形式的 PATCH 会 404（本流程栽过）
          note=""
          if ! out="$(GH_TOKEN="$RELEASE_TOKEN" gh release edit "$TAG" --draft=false --notes-file notes.md 2>&1)"; then
            note="gh release edit 失败（$(printf '%s' "$out" | tr '\n' ' ' | tail -c 200)）；改用 id 形式 PATCH"
            echo "::warning::$note"
            rel_id="$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq .id 2>/dev/null || true)"
            if [ -z "$rel_id" ] || ! out="$(GH_TOKEN="$RELEASE_TOKEN" gh api -X PATCH "repos/$GH_REPO/releases/$rel_id" -f draft=false -f make_latest=false 2>&1)"; then
              echo "::error::发布失败（Release 仍是草稿，使用者看不见）：$(printf '%s' "$out" | tr '\n' ' ' | tail -c 300)"
              exit 1
            fi
          fi

          # 核对：署名、每个附件的内容、Latest 归属
          #（published_at 会被重置成重建时刻——API 没有回填它的字段；订阅者会看到一次「重新发布」）
          # 署名读不回来时（报错文本落进 $login）也会走到下面的比对里，报出人话
          login="$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq .author.login 2>&1 || true)"
          if [ "$login" != "$pat_login" ]; then
            echo "::error::重建后署名是 $login，不是发布令牌身份 $pat_login"
            exit 1
          fi
          trouble=""
          while IFS="$(printf '\t')" read -r name size digest; do
            f="backup/$name"
            [ -f "$f" ] || continue
            now_digest="$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq ".assets[] | select(.name == \"$name\") | (.digest // \"\")" 2>/dev/null || true)"
            now_size="$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq ".assets[] | select(.name == \"$name\") | .size" 2>/dev/null || true)"
            if [ -z "$now_digest" ]; then
              [ "$now_size" = "$(stat -c%s "$f")" ] || { echo "::error::$name 回传后字节数不符"; trouble=1; }
            elif [ "$now_digest" != "sha256:$(sha256sum "$f" | cut -d' ' -f1)" ]; then
              echo "::error::$name 回传后校验和不符（远端 $now_digest）"
              trouble=1
            fi
          done < assets.tsv
          if [ -n "$trouble" ]; then
            echo "::error::回传后有附件对不上，请人工核对 $TAG"
            exit 1
          fi

          # Latest 归属：草稿转正会把 Latest 抢过来（文档：make_latest 默认 true，
          #「Defaults to true for newly published releases」），把原来那个还回去。
          # 改 Release 只能走数字 id：id 用 tags/<tag> 查得到，PATCH 认的是 id。
          prev_latest="$(sed 's/^当前 Latest：//' prev-latest.txt)"
          now_latest="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>/dev/null || true)"
          if [ -n "$prev_latest" ] && [ "$prev_latest" != "$TAG" ] && [ "$prev_latest" != "无" ] && [ "$now_latest" = "$TAG" ]; then
            echo "::warning::$TAG 被设成了 Latest（原本是 $prev_latest），改回去"
            prev_id="$(gh api "repos/$GH_REPO/releases/tags/$prev_latest" --jq .id 2>/dev/null || true)"
            if [ -n "$prev_id" ]; then
              GH_TOKEN="$RELEASE_TOKEN" gh api -X PATCH "repos/$GH_REPO/releases/$prev_id" -f make_latest=true > /dev/null \
                || echo "::warning::改回 Latest 失败，请在 Release 页面上手动把 $prev_latest 设为 latest"
            else
              echo "::warning::找不到 $prev_latest 的 Release（已被删？），Latest 暂留在 $TAG"
            fi
          fi
          echo "已重建 $TAG：署名 $login，附件 $(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '.assets | length') 个，Latest 为 $(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>/dev/null || echo 无)"

      - name: 删除 Release、保留 tag（delete-release）
        if: ${{ success() && inputs.task == 'delete-release' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          # 查与删都用 PAT：草稿的可见性有边界，用内置 token 会把「有个草稿」看成「没有 Release」
          gh_view() { GH_TOKEN="${RELEASE_TOKEN:-$GH_TOKEN}" gh release view "$@"; }
          if ! gh_view "$TAG" > /dev/null 2>&1; then
            echo "::error::$TAG 没有 Release——先确认 tag 推过、名字没打错（若确实只有草稿而这里也查不到，说明 RELEASE_TOKEN 没配）"
            exit 1
          fi
          echo "即将删除：$(gh_view "$TAG" --json tagName,isDraft,name,assets --jq '"\(.tagName)｜标题「\(.name)」｜草稿=\(.isDraft)｜附件 \(.assets | length) 个"')"
          gh_view "$TAG" --json assets --jq '.assets[].name' | sed 's/^/  - /'
          GH_TOKEN="${RELEASE_TOKEN:-$GH_TOKEN}" gh release delete "$TAG" --yes     # 不带 --cleanup-tag：tag 必须留着，CI 才认得出该发哪一版
          echo "已删除 $TAG 的 Release（tag 仍在）。要重发：把该 tag 强推一次即可触发 CI 用当前提交重建（见 AGENTS.md「发版」）"
