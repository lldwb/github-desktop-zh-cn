# electron-builder.yml — GUI 产物打包配置（npm run dist）
#
# 四处刻意的选择（理由见 docs/gui/design.md）：
#   1. 字典走 extraResources（进应用的 resources/dictionaries）而不是 extraFiles（exe 同级）：
#      数据根与 exe 未必同处一地——macOS 的数据根恒在用户数据目录（.app 包内写入会让签名失效、
#      下次启动被 Gatekeeper 拒开），Linux 的 AppImage 又挂在只读临时目录，两者都取不到 exe 旁边那份。
#      改由 gui/main.js 首次运行时把数据根里缺的版本播种过去，三平台一条路径，
#      common.dataRoot() 与字典查找逻辑零改动。
#   2. 不做 portable 目标：portable 版运行时会把自己解压到临时目录，process.execPath
#      指向那个临时位置，dataRoot() 会把备份与 config.json 写进临时目录里。
#      免安装需求由 zip 目标满足——解压即用，数据根就落在解压目录。
#   3. macOS 不做代码签名（identity: null）：本仓库没有证书。未签名产物的打开方式见 README「方式一」。
#   4. 本文件里**没有** publish 配置，且 package.json 的 dist 脚本固定带 `--publish never`：
#      electron-builder 26 只要在 CI 上跑就隐式开发布（检出 tag 时按 onTag、仅检测到 CI 时按
#      onTagOrDraft），缺 GH_TOKEN 会在构建**全部跑完之后**才报错退出——本仓库的 Release 由
#      `gh release create` 创建，不走 electron-builder，所以这里显式关掉，见 AGENTS.md「已知坑」。

appId: com.lldwb.github-desktop-zh-cn

# 运行时裁剪（win-unpacked 368 → 292 MB，NSIS 安装包 107 → 91 MB）。
#   electronLanguages：Electron 二进制里约 50 MB 是 55 个 Chromium 语言包，缺语言包时回退
#     en-US，而本应用的界面是自绘 HTML——只保留中英两个，省约 48 MB（三平台通用）。
#   afterPack：打包后删掉用不到的运行时组件（软渲染 / WebGPU 编译器），清单与实测见 build/after-pack.js。
# 体积构成与「zip 为何压不到 100 MB」见 docs/打包与分发.md「常见问题」。
electronLanguages:
  - en-US
  - zh-CN
afterPack: build/after-pack.js
productName: GitHub Desktop 汉化工具
executableName: GitHubDesktopZhTool
copyright: GPL-3.0

directories:
  output: dist/gui
  buildResources: build

# 产物命名与单文件产物（SEA）同一套词序：<name>-<通道>-v<版本>-<平台>-<架构>[...-setup].<扩展名>
# 通道词 gui 紧跟项目名（单文件产物是 cli，见 scripts/build.js）——附件列表里同类相邻、一眼分得出
# 用 ${platform}（darwin / win32 / linux）而不是 ${os}（mac / win / linux），与 SEA 产物的平台词一致
artifactName: ${name}-gui-v${version}-${platform}-${arch}.${ext}

# 应用代码：界面 + 业务逻辑（主进程直接 require scripts/ 下的模块）
files:
  - gui/**/*
  - scripts/**/*
  - package.json

# 字典：进应用的 resources 目录，由 gui/main.js 首次运行时播种到数据根（见文件头说明 1）
extraResources:
  - from: dictionaries
    to: dictionaries

# 构建期网络：国内直连 GitHub 下载 Electron 二进制会超时，走 npmmirror。
# electron-builder 取 Electron 走的是 resolveAssetURL，只认这个 yml 键（不读 ELECTRON_MIRROR）；
# CI 在境外，由 workflow 用 --config.electronDownload.mirror=… 覆盖回官方源。
electronDownload:
  mirror: https://registry.npmmirror.com/-/binary/electron/

win:
  target:
    - nsis
    - zip

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: GitHub Desktop 汉化工具
  # 与 zip 区分开，命名风格同单文件产物
  artifactName: ${name}-gui-v${version}-${platform}-${arch}-setup.${ext}

mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  identity: null

linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: lldwb <lldwb@users.noreply.github.com>
  synopsis: GitHub Desktop 中文汉化工具（字典驱动）
  description: 定位 GitHub Desktop 安装目录，按 JSON 语言字典替换界面文本，可随时还原；字典可自定义、可在线更新。
